# Compose stack for optional local student exploration.
# NOTE: No scored lab or pytest evaluation depends on these containers.
# All scored tests run strictly deterministic and network-isolated in-process.

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentik-postgres
    environment:
      POSTGRES_USER: agentik
      POSTGRES_PASSWORD: agentik_password
      POSTGRES_DB: agentik_lab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentik -d agentik_lab"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: agentik-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: agentik-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: agentik-jaeger
    ports:
      - "16686:16686" # Web UI
      - "4317"        # OTLP gRPC
      - "4318"        # OTLP HTTP

volumes:
  pgdata:
  qdrant_data:
