name: Official Certification Attestation

on:
  workflow_call:
    inputs:
      course_id:
        required: true
        type: string
        description: "Course identifier or slug (e.g., curso-0, llm-production-fundamentals)"
      student_repo:
        required: true
        type: string
        description: "Repository owner/name of student submission"
      commit_sha:
        required: true
        type: string
        description: "Commit SHA being certified"
      agentik_api_url:
        required: false
        type: string
        default: "https://api.agentik.im"
        description: "Agentik API base URL"
    secrets:
      AGENTIK_SUITE_TOKEN:
        required: true
        description: "Read-only token to download the private official test suite"
    outputs:
      report_hash:
        description: "Cryptographic SHA-256 hash of the test execution report"
        value: ${{ jobs.certify.outputs.report_hash }}
      attestation_status:
        description: "Final outcome (success or failure)"
        value: ${{ jobs.certify.outputs.attestation_status }}

permissions:
  id-token: write
  contents: read

jobs:
  certify:
    name: Run Official Hidden & Parametric Suite
    runs-on: ubuntu-latest
    outputs:
      report_hash: ${{ steps.report.outputs.report_hash }}
      attestation_status: ${{ steps.report.outputs.attestation_status }}

    steps:
      - name: Check out student repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download official test suite
        env:
          AGENTIK_SUITE_TOKEN: ${{ secrets.AGENTIK_SUITE_TOKEN }}
        run: |
          if [ -z "$AGENTIK_SUITE_TOKEN" ]; then
            echo "::error::AGENTIK_SUITE_TOKEN is required. Attestation never falls back to tests committed in the student repository."
            exit 1
          fi
          git -c "http.extraheader=Authorization: Basic $(printf 'x-access-token:%s' "$AGENTIK_SUITE_TOKEN" | base64 -w0)"             clone --depth 1 https://github.com/themikehage/agentik-hidden-suite.git "$RUNNER_TEMP/official-suite"
          rm -rf "$RUNNER_TEMP/official-suite/.git"

      - name: Set up uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "0.5.31"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Run verification suite
        id: test_run
        env:
          AGENTIK_STUDENT_ID: ${{ github.actor }}
          AGENTIK_STUDENT_REPO: ${{ github.repository }}
          COURSE: ${{ inputs.course_id }}
        run: |
          if ! printf '%s' "$COURSE" | grep -Eq '^[a-z0-9-]{1,40}$'; then
            echo "::error::Invalid course_id."
            exit 1
          fi
          case "$COURSE" in
            "llm-production-fundamentals"|"curso-0"|"0")
              COURSE_DIR="curso-0"
              echo "CANONICAL_COURSE_SLUG=llm-production-fundamentals" >> $GITHUB_ENV
              ;;
            "multiagent-pipeline-engineer"|"curso-1"|"1")
              COURSE_DIR="curso-1"
              echo "CANONICAL_COURSE_SLUG=multiagent-pipeline-engineer" >> $GITHUB_ENV
              ;;
            "mcp-expert"|"curso-2"|"2")
              COURSE_DIR="curso-2"
              echo "CANONICAL_COURSE_SLUG=mcp-expert" >> $GITHUB_ENV
              ;;
            "forward-deployed-engineer"|"curso-3"|"3")
              COURSE_DIR="curso-3"
              echo "CANONICAL_COURSE_SLUG=forward-deployed-engineer" >> $GITHUB_ENV
              ;;
            *)
              echo "::error::Unknown course_id '$COURSE'. Only the four official capstones can be attested."
              exit 1
              ;;
          esac
          TEST_TARGET="$COURSE_DIR/m7-capstone/tests"
          OFFICIAL_TESTS="$RUNNER_TEMP/official-suite/$TEST_TARGET"
          if [ ! -d "$OFFICIAL_TESTS" ]; then
            echo "::error::Official suite for $COURSE_DIR not found."
            exit 1
          fi
          # Only the official tests are executed: whatever the student committed under tests/ is discarded.
          rm -rf "$TEST_TARGET"
          cp -R "$OFFICIAL_TESTS" "$TEST_TARGET"
          echo "Running official suite for target: $TEST_TARGET"
          # Student code must not be able to write runner command files or read the suite token.
          GH_ENV_FILE="$GITHUB_ENV"; GH_PATH_FILE="$GITHUB_PATH"
          rm -f report.json
          set +e
          env -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_OUTPUT -u GITHUB_STATE -u AGENTIK_SUITE_TOKEN -u RUNNER_TEMP             uv run --frozen pytest -q --tb=no -p no:cacheprovider             --json-report --json-report-file=report.json "$TEST_TARGET"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ] || [ ! -s report.json ]; then
            echo "TESTS_FAILED=true" >> "$GH_ENV_FILE"
          fi

      - name: Compute report digest and status
        id: report
        run: |
          if [ -s report.json ] && [ "$TESTS_FAILED" != "true" ]; then
            REPORT_HASH=$(sha256sum report.json | awk '{print $1}')
            echo "report_hash=$REPORT_HASH" >> $GITHUB_OUTPUT
          else
            echo "report_hash=none" >> $GITHUB_OUTPUT
            TESTS_FAILED=true
          fi
          if [ "$TESTS_FAILED" = "true" ]; then
            echo "attestation_status=failed" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "attestation_status=success" >> $GITHUB_OUTPUT
          fi

      - name: Request GitHub OIDC Token
        id: oidc
        if: ${{ success() && steps.report.outputs.attestation_status == 'success' && env.CANONICAL_COURSE_SLUG != '' }}
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            OIDC_TOKEN=$(curl -sLS "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=agentik-attestation:${CANONICAL_COURSE_SLUG}" \
              -H "User-Agent: actions/oidc-client" \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value')
            echo "::add-mask::$OIDC_TOKEN"
            echo "token=$OIDC_TOKEN" >> $GITHUB_OUTPUT
          else
            echo "OIDC token request environment variables not available."
          fi

      - name: Submit Attestation to Agentik API
        if: ${{ success() && steps.oidc.outputs.token != '' }}
        env:
          API_URL: ${{ inputs.agentik_api_url }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          COURSE_SLUG: ${{ env.CANONICAL_COURSE_SLUG }}
          REPORT_HASH: ${{ steps.report.outputs.report_hash }}
        run: |
          REPORT_CONTENT=$(cat report.json)
          curl -fsSL -X POST "${API_URL}/api/attestation" \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"courseSlug\":\"${COURSE_SLUG}\",\"reportHash\":\"${REPORT_HASH}\",\"report\":${REPORT_CONTENT}}"
