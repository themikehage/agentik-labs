name: Practitioner Certification Attestation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  attest:
    name: Attest Official Capstone
    if: github.repository != 'themikehage/agentik-labs'
    uses: themikehage/agentik-labs/.github/workflows/certify.yml@123995823a8fb16ed15bd3836751b2cdc3798071
    with:
      course_id: mcp-expert
      student_repo: ${{ github.repository }}
      commit_sha: ${{ github.sha }}
