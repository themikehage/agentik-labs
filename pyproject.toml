[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentik-labkit"
version = "0.1.0"
description = "Deterministic evaluation and lab core for Agentik AI Academy"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Agentik Core Team", email = "core@agentik.im" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-socket>=0.7.0",
    "tiktoken>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["labkit"]

[tool.pytest.ini_options]
testpaths = ["tests", "curso-0", "curso-2"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --disable-socket --allow-unix-socket"
